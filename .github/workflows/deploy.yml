name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e 's/\\n/\n/g' \
            | awk '
                /-----BEGIN/ {print; keep=1; next}
                /-----END/ {print; keep=0; next}
                keep {gsub(/[ \t]/, ""); if (length($0) > 0) print}
              ' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q 'PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "DEPLOY_SSH_KEY is not an OpenSSH private key."
            echo "Paste the file that starts with BEGIN OPENSSH PRIVATE KEY or BEGIN RSA PRIVATE KEY."
            echo "Do not paste the .pub file, a .ppk file, or a key that asks for a passphrase."
            exit 1
          fi
          python3 - << 'PY'
          import textwrap
          exec(textwrap.dedent("""
              import base64, pathlib, sys
              text = pathlib.Path("/home/runner/.ssh/deploy_key").read_text(errors="replace")
              if "ENCRYPTED" in text:
                  print("This private key has a passphrase. Create one with: ssh-keygen -t ed25519 -N \\"\\"")
                  sys.exit(1)
              if "OPENSSH PRIVATE KEY" in text:
                  body = "".join(line for line in text.splitlines() if not line.startswith("-----"))
                  try:
                      raw = base64.b64decode(body, validate=True)
                  except Exception:
                      print("The key text between the BEGIN and END lines is not valid base64.")
                      print("Generate a new key and paste the private file again, with its line breaks.")
                      sys.exit(1)
                  if not raw.startswith(b"openssh-key-v1\\0"):
                      print("The key banner says OpenSSH, but the body is not an OpenSSH key.")
                      sys.exit(1)
                  rest = raw[len(b"openssh-key-v1\\0"):]
                  length = int.from_bytes(rest[:4], "big")
                  cipher = rest[4:4 + length].decode(errors="replace")
                  print("OpenSSH private key cipher: " + cipher)
                  if cipher != "none":
                      print("This private key has a passphrase. Create one with: ssh-keygen -t ed25519 -N \\"\\"")
                      sys.exit(1)
          """))
          PY
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          rm -f ~/.ssh/deploy_key

      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Sync files via rsync
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.ddev/' \
            --exclude '.env' \
            --exclude 'storage/uploads/' \
            --exclude 'storage/logs/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Run post-deployment tasks
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            cd '${DEPLOY_PATH}' && \
            mkdir -p storage/uploads storage/logs && \
            chmod -R u+rwX storage && \
            '${PHP_BIN}' bin/migrate.php
          "
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ secrets.PHP_BIN }}